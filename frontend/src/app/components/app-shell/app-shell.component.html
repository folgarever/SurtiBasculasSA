<div class="app-shell">
  <a class="skip-link" href="#contenido-principal" (click)="saltarAlContenido($event)">Saltar al contenido</a>
  <aside class="app-sidebar">
    <a class="sidebar-brand" [routerLink]="esAdmin ? '/admin' : inicio"><span class="brand-logo-frame"><img class="brand-logo" src="/surtibasculas-logo.png" alt="SURTIBÁSCULAS S.A."></span><span>SURTIBÁSCULAS S.A.<small>Plataforma de gestión</small></span></a>
    <nav class="sidebar-nav" aria-label="Navegación principal">
      @for (seccion of secciones; track seccion.label) {
        <div class="sidebar-section" role="group" [attr.aria-label]="seccion.label">
          <span class="sidebar-section-title">{{ seccion.label }}</span>
          @for (item of seccion.items; track item.route) {
            <a class="sidebar-link" [class.is-active]="esActivo(item.route)" [attr.aria-current]="esActivo(item.route) ? 'page' : null" [routerLink]="item.route">
              @if (item.icon) { <ng-icon [name]="item.icon" size="18" /> }
              {{ item.label }}
            </a>
          }
        </div>
      }
    </nav>
    <div class="sidebar-footer"><span class="status-dot"></span><span>Sistema activo<small>Gestión de personal</small></span></div>
  </aside>
  <header class="topbar">
    <div class="topbar-title"><span class="admin-label">{{ topbarLabel }}</span><strong>{{ topbarTitle }}</strong></div>
    <div class="topbar-actions">
      <app-notificaciones />
      <app-selector-tema [admin]="admin" [nombre]="nombre" [inicial]="inicial" [foto]="fotoPerfil()" />
      <button class="icon-button" type="button" aria-label="Cerrar sesión" title="Cerrar sesión" (click)="salir()"><ng-icon name="lucideLogOut" size="17" /></button>
    </div>
  </header>

  <main id="contenido-principal" class="workspace" tabindex="-1" [ngClass]="workspaceClass">
    <ng-content />
  </main>
</div>
